<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河岸上的目光</title><link rel="license" href="scan-source.txt"><canvas id="c"></canvas>
<script>
const shotURL=new URL(location.href);
if(!shotURL.searchParams.has("portrait")){
  shotURL.searchParams.set("portrait","sitter");
  history.replaceState(null,"",shotURL);
}
</script>
<script type="module">
import { initGPU, loadAtlas, run, fail } from "../lib.js";
import { createSitterShot } from "./sitter-shot.js";
try {
  const g=await initGPU(document.getElementById("c"));
  const scene=await createSitterShot(g,await loadAtlas(g.device));
  await run({g,scene,seg:[44.58,55.92],title:"河岸上的目光",notes:{9:"AI（大语言模型）由人类写下的文字训练而成"}});
} catch(error) {fail(error.stack||String(error));}
</script></html>
