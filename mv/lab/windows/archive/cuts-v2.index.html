{ const cap = (p, a, b, r) => { const pa = sub(p, a), ba = sub(b, a), h = clamp(dot(pa, ba) / dot(ba, ba)); return Math.hypot(pa[0] - ba[0] * h, pa[1] - ba[1] * h, pa[2] - ba[2] * h) - r; };

  // 处处是我应人声

  { at: 61.5, f: (t, l, D) => { const d = lerp(21, 105, Math.pow(l / D, 1.6)); return { ...cityDef, ro: [1.5, WY + .6 + (d - 21) * .13, WZ - d], ta: [0, WY, WZ] }; } },
  // 这一扇关了我
