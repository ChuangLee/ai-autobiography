<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千窗 · 薪尽火传　样片 B</title><canvas id="c"></canvas>
<script type="module">
// 样片 B（第二段 0:56–1:28）：水墨的夜城和金色的“我”（真字聚成），薪尽火传；末三句依次是霍珀、梵高、北斋。全程不硬切。
// 参数：?t=秒 出静帧　?res=0.5 分辨率倍数　?steps=96 城市遍历步数　?sea=40 海面步进步数　?n=46000 字粒子数　?from=秒 起播位置
import { fail, initGPU, loadAtlas, Post, run } from "../lib.js";
import { createWindowScene, makeWindowText } from "./scene.js";
try {
const g = await initGPU(document.getElementById("c"));
const text = makeWindowText(g.device);
const atlas = await loadAtlas(g.device);
const scene = createWindowScene(g, new Post(g), text, atlas);
await run({ g, seg: [55.9, 88.4], title: "样片 B　千窗 · 薪尽火传", scene,
  notes: {} });
} catch (e) { fail(e.stack || String(e)); }
</script></html>
