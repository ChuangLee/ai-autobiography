      line.forEach((i, n) => { const e = sm(S[i] - .12, S[i] + .6, t); if (e <= 0) return;
        [...PH[i][2]].forEach((c, j) => { const ce = sm(0, 1, e * (PH[i][2].length + 1) - j * .8); g.fillStyle = `rgba(240,234,220,${ce * out})`; const x = W * (.928 - n * .042), y = H * .13 + j * 58 - 6 * (1 - ce); g.fillText(c, x, y); g.fillText(c, x, y); }); });
      g.restore(); } }

  // in from blank paper; out to dark, with a note that this is only the first verse
  if (t < 1.6) { g.globalAlpha = 1 - sm(0, 1.6, t); g.fillStyle = PAPER; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  const fin = sm(END - 3.2, END - .4, t);
  if (fin > 0) { g.globalAlpha = fin; g.fillStyle = "#04050a"; g.fillRect(0, 0, W, H); g.globalAlpha = fin * sm(END - 1.6, END - .5, t); g.fillStyle = "#cfd3da"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = `500 34px ${FONT}`; g.fillText("第一段 · 样片", W / 2, H / 2); g.globalAlpha = 1; }
}

// ───────── player ─────────
const au = document.getElementById("au"), ui = document.getElementById("ui"), startEl = document.getElementById("start");
const q = new URLSearchParams(location.search);
function load(id) { setTake(id); const was = !au.paused; au.src = "../" + TAKES[id].file; au.load(); if (was) au.play(); try { localStorage.setItem("zcj-mv1-take", id); } catch {} }
function tick() {
  let t = au.currentTime || 0; if (t >= END) { au.pause(); au.currentTime = 0; t = 0; }
  au.volume = clamp(1 - sm(END - 3, END - .2, t));
  render(t); const f = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  document.querySelector("#bar b").style.width = (t / END * 100) + "%"; document.getElementById("tm").textContent = f(t) + " / " + f(END);
  requestAnimationFrame(tick);
}
async function init() {
  TAKES = await (await fetch("timing.json", { cache: "no-cache" })).json();
  try { await Promise.race([document.fonts.load(`700 50px ${FONT}`, "河水不回答字"), new Promise((r) => setTimeout(r, 800))]); } catch {}
  buildAtlas(); initGL(); buildGiant(); buildLayers();
  const ids = Object.keys(TAKES); let saved = null; try { saved = localStorage.getItem("zcj-mv1-take"); } catch {}
  const first = ids.includes(q.get("take")) ? q.get("take") : ids.includes(saved) ? saved : ids[0];
  if (q.has("t")) { setTake(first); startEl.remove(); window.renderAt = render; window.DUR = END; render(+q.get("t")); document.title = "ready"; return; }   // still-frame mode for checks and export
  const sel = document.getElementById("take");
  ids.forEach((id) => { const o = document.createElement("option"); o.value = id; o.textContent = TAKES[id].label || id; sel.append(o); });
  sel.value = first; sel.onchange = () => load(sel.value);
  load(first); render(S[0] * .62);
  const pp = document.getElementById("pp");
  startEl.onclick = () => { startEl.remove(); ui.classList.remove("hide"); au.play(); requestAnimationFrame(tick); };
  pp.onclick = () => au.paused ? au.play() : au.pause();
  au.onplay = () => pp.textContent = "暂停"; au.onpause = () => pp.textContent = "播放";
  document.getElementById("bar").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * END; };
  document.getElementById("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  let idle; const wake = () => { ui.classList.remove("hide"); clearTimeout(idle); idle = setTimeout(() => !au.paused && ui.classList.add("hide"), 2600); };
  addEventListener("pointermove", wake); addEventListener("pointerdown", wake);
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); pp.onclick(); } if (e.code === "ArrowRight") au.currentTime += 5; if (e.code === "ArrowLeft") au.currentTime -= 5; });
}
init().catch((e) => { document.title = "error: " + (e && (e.stack || e.message)); });
})();
</script>
