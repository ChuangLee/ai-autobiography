async function renderAt(t) {

// ───────── player ─────────
const au = document.getElementById("au"), ui = document.getElementById("ui"), startEl = document.getElementById("start");
const q = new URLSearchParams(location.search);
function load() { au.src = "../" + SONG.file; au.load(); }
const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function tick() {

  driveVideos(t, !au.paused); render(t);
  document.querySelector("#bar b").style.width = (t / END * 100) + "%"; document.getElementById("tm").textContent = fmt(t) + " / " + fmt(END);

async function init() {
  const lo = document.getElementById("load"); lo.textContent = "载入字库…";
  setSong(await (await fetch("song.json", { cache: "no-cache" })).json());
  await loadAtlas();
  try { await Promise.race([document.fonts.load(`400 50px ${FONT}`, "字河水"), new Promise((r) => setTimeout(r, 1500))]); } catch {}

  render(0);
  const pp = document.getElementById("pp");
  startEl.onclick = () => { startEl.remove(); ui.classList.remove("hide"); au.play(); vs.forEach((v) => { v.play().then(() => v.pause()).catch(() => {}); }); requestAnimationFrame(tick); };
  pp.onclick = () => au.paused ? au.play() : au.pause();
  au.onplay = () => pp.textContent = "暂停"; au.onpause = () => pp.textContent = "播放";
  document.getElementById("bar").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * END; };
  document.getElementById("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

  addEventListener("pointermove", wake); addEventListener("pointerdown", wake);
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); pp.onclick(); } if (e.code === "ArrowRight") au.currentTime += 5; if (e.code === "ArrowLeft") au.currentTime -= 5; });
}
init().catch((e) => { document.title = "error: " + (e && (e.stack || e.message)); console.error(e); });
})();
