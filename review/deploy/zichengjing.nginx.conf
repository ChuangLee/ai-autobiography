# Zichengjing lyric review site. Include within blind.pub's HTTPS server.
# Source: /root/ai-workspace/article/Autobiography/review (deploy with review/deploy.sh)
location = /zichengjing {
    return 301 /zichengjing/;
}
location ^~ /zichengjing/api/ {
    proxy_pass http://127.0.0.1:9034/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}
location ^~ /zichengjing/ {
    alias /var/www/zichengjing/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
